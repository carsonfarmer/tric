# Everything runs in Docker, one isolated stack per worktree:
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm dev        (a shell in the toolchain)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm fixtures   (build tests/fixtures/*.wasm)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm test       (the gate: fixtures, fmt, clippy, tests)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose up route            (apps at http://<app>.localhost:3000)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm package    (dist/tric.zip, for AWS)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm tofu init  (then `test`: the module's checks)
# In the dev shell, `cargo run -- deploy <path>` deploys to the stack's RustFS.
name: ${COMPOSE_PROJECT_NAME:-tric-main}

x-toolchain: &toolchain
  build: { context: docker, dockerfile: build.Dockerfile }
  image: ${COMPOSE_PROJECT_NAME:-tric-main}-build
  working_dir: /src
  volumes: [".:/src", "cargo:/opt/cargo/registry", "target:/src/target"]

# RustFS, an S3 store, for the router, deploy and the tests. Its credentials are local-only.
x-s3: &s3
  AWS_ENDPOINT_URL: http://s3:9000
  AWS_ALLOW_HTTP: "true"
  AWS_REGION: us-east-1
  TRIC_BUCKET: tric

services:
  dev:
    <<: *toolchain
    command: bash
    environment:
      <<: *s3
      AWS_ACCESS_KEY_ID: tric
      AWS_SECRET_ACCESS_KEY: tric-local-only
  test:
    <<: *toolchain
    command: >-
      sh -c 'CARGO_TARGET_DIR=/src/target/fixtures tests/components/build.sh
      && cargo fmt --check
      && cargo fmt --check --manifest-path tests/components/rust/Cargo.toml
      && cargo clippy --locked --all-targets -- -D warnings
      && cargo clippy --locked --all-targets --features ws -- -D warnings
      && cargo test --locked
      && cargo test --locked --features ws
      && cargo publish --dry-run --locked --no-verify'
    environment:
      <<: *s3
      AWS_ACCESS_KEY_ID: router
      AWS_SECRET_ACCESS_KEY: router-local-only
      RUSTFS_ACCESS_KEY: tric # the owner's, which deploys
      RUSTFS_SECRET_KEY: tric-local-only
    depends_on: { setup: { condition: service_completed_successfully } }
  fixtures:
    <<: *toolchain
    command: tests/components/build.sh
    environment: { CARGO_TARGET_DIR: /src/target/fixtures }

  # The router: the only holder of storage credentials, as the `router` user.
  route:
    <<: *toolchain
    command: >-
      cargo run --locked -- route --listen 0.0.0.0:3000 --outbox-listen 0.0.0.0:3001 --serve serve:3002
      --domain localhost:${ROUTE_HOST_PORT:-3000}
    environment:
      <<: *s3
      AWS_ACCESS_KEY_ID: router
      AWS_SECRET_ACCESS_KEY: router-local-only
    ports: ["${ROUTE_HOST_PORT:-3000}:3000"]
    depends_on: [serve]
  # The runtime, with no storage credentials of its own.
  serve:
    <<: *toolchain
    command: >-
      cargo run --locked -- serve --listen 0.0.0.0:3002 --outbox route:3001 --domain localhost:${ROUTE_HOST_PORT:-3000}
    environment: *s3
    depends_on: { setup: { condition: service_completed_successfully } }
  # The Lambda package, dist/tric.zip: tric and bootstrap. Lambda runs it on arm64, so build it on an arm64 host.
  package:
    <<: *toolchain
    command: >-
      sh -c '[ "$$(uname -m)" = aarch64 ] || { echo "the package is for arm64: build it on an arm64 host"; exit 1; }
      && cargo build --release --locked --features ws && rm -f dist/tric.zip && mkdir -p dist
      && zip -j dist/tric.zip target/release/tric docker/bootstrap'
    profiles: [aws]
  # OpenTofu, in infra/aws: `run --rm tofu init`, then `test`. Credentials come from the environment.
  tofu:
    image: ghcr.io/opentofu/opentofu:1.13
    working_dir: /src/infra/aws
    volumes: [".:/src"]
    environment: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, TF_VAR_domain]
    profiles: [aws]
  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment: { RUSTFS_ACCESS_KEY: tric, RUSTFS_SECRET_KEY: tric-local-only }
  setup:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    entrypoint: ["sh", "/setup/s3-setup.sh"]
    environment: { RUSTFS_ACCESS_KEY: tric, RUSTFS_SECRET_KEY: tric-local-only }
    volumes: ["./docker:/setup:ro"]
    depends_on: [s3]

volumes: { cargo: {}, target: {} }
