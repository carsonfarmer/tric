# Everything runs in Docker, one isolated stack per worktree:
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm dev        (a shell in the toolchain)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm fixtures   (build tests/fixtures/*.wasm)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm test       (the gate: fixtures, fmt, clippy, tests)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm release    (dist/tric.zip, for Lambda's arm64)
#   COMPOSE_PROJECT_NAME=tric-<worktree> docker compose run --rm tofu …     (OpenTofu in infra/aws: see its README)
name: ${COMPOSE_PROJECT_NAME:-tric-main}

x-toolchain: &toolchain
  build: { context: docker, dockerfile: build.Dockerfile }
  image: ${COMPOSE_PROJECT_NAME:-tric-main}-build
  working_dir: /src
  volumes: [".:/src", "cargo:/opt/cargo/registry", "target:/src/target"]

services:
  dev:
    <<: *toolchain
    command: bash
  # The gate CI runs, with the end-to-end tests against MinIO as well as in memory.
  test:
    <<: *toolchain
    command: >-
      sh -c 'CARGO_TARGET_DIR=/src/target/fixtures tests/components/build.sh
      && cargo fmt --check
      && cargo clippy --locked --all-targets -- -D warnings
      && cargo test --locked
      && cargo publish --dry-run --locked --no-verify'
    depends_on: { s3: { condition: service_healthy } }
    environment:
      TRIC_TEST_STORE: s3://tric
      AWS_ENDPOINT: http://s3:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: tric
      AWS_SECRET_ACCESS_KEY: tric-secret
      AWS_REGION: us-east-1
  fixtures:
    <<: *toolchain
    command: tests/components/build.sh
    environment: { CARGO_TARGET_DIR: /src/target/fixtures }
  release:
    <<: *toolchain
    platform: linux/arm64
    command: sh -c 'cargo build --release --bin tric && rm -f dist/tric.zip && mkdir -p dist && zip -j dist/tric.zip infra/aws/bootstrap target/release/tric'
  # S3 for the tests: MinIO, with the bucket `tric`, versioned as an install's is. It outlives a run, as the tests' app
  # names are their own.
  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: >-
      sh -c 'minio server /data --quiet & until mc alias set s3 http://localhost:9000 tric tric-secret >/dev/null;
      do sleep 1; done; mc mb -p s3/tric && mc version enable s3/tric && touch /tmp/ready && wait'
    environment: { MINIO_ROOT_USER: tric, MINIO_ROOT_PASSWORD: tric-secret }
    healthcheck: { test: test -f /tmp/ready, interval: 1s, retries: 60 }
  tofu:
    image: ghcr.io/opentofu/opentofu:1.13
    working_dir: /src/infra/aws
    volumes: [".:/src", "${HOME}/.aws:/root/.aws"]
    environment: [AWS_PROFILE]

volumes: { cargo: {}, target: {} }
