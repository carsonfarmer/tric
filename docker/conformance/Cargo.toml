# The wasi-testsuite's Rust tests of the file system for WASI 0.3, built in the conformance stage of build.Dockerfile,
# where this is copied next to their sources. Each test is a library that exports `wasi:cli/run`, its `main` a stub that
# is never called: as a program its `main` would export `wasi:cli/run` too. wit-bindgen is 0.62.0, not the suite's
# 0.58.0, as 0.58.0 keeps a task's state in the context slot that wasi-libc keeps for the task's stack.
[package]
name = "conformance"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
futures = "=0.3.32"
wit-bindgen = { version = "=0.62.0", features = ["async-spawn"] }

[lints.rust]
dead_code = "allow"

[[example]]
name = "filesystem-advise"
path = "src/bin/filesystem-advise.rs"
crate-type = ["cdylib"]

[[example]]
name = "filesystem-dotdot"
path = "src/bin/filesystem-dotdot.rs"
crate-type = ["cdylib"]

