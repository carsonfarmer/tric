[package]
name = "fixture-spin"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# Only the SDK's http module: its key-value and variables modules import spin:* interfaces, which the host does not provide.
[dependencies]
form_urlencoded = "1"
serde_json = "1"
spin-sdk = { version = "7", default-features = false, features = ["http"] }

