[package]
name = "fixture"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# Build with exactly one: `app`, the test app, or `guard`, the test middleware.
[features]
app = ["dep:form_urlencoded", "dep:http", "dep:serde_json", "dep:wasip3"]
guard = []

[dependencies]
form_urlencoded = { version = "1", optional = true }
http = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
wasip3 = { version = "0.9", optional = true, features = ["http-compat"] }
wit-bindgen = "0.62"

[workspace]
