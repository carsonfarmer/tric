[package]
name = "fixture"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# Build with exactly one of `p2` and `p3` (the wasi:http world). `probe` adds the routes that exercise the host, and `kv`
# the wasi:keyvalue and wasi:config routes (and imports).
[features]
p2 = ["dep:wasip2"]
p3 = ["dep:wasip3", "dep:http"]
probe = []
kv = ["dep:form_urlencoded", "dep:wit-bindgen"]

[dependencies]
form_urlencoded = { version = "1", optional = true }
http = { version = "1", optional = true }
serde_json = "1"
wasip2 = { version = "2", optional = true }
wasip3 = { version = "0.9", optional = true, features = ["http-compat"] }
wit-bindgen = { version = "0.62", optional = true }

[workspace]
