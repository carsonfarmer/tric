[package]
name = "tric"
version = "0.1.0"
edition = "2024"
rust-version = "1.96" # Wasmtime 49's
license = "Apache-2.0"
description = "A scale-to-zero host for WASI components, with its state in object storage"
repository = "https://github.com/carsonfarmer/tric"
readme = "README.md"
keywords = ["wasm", "wasi", "component-model", "serverless", "lambda"]
categories = ["wasm", "web-programming::http-server", "command-line-utilities"]
include = ["/src", "/wit", "/README.md", "/LICENSE"]

[features]
# WebSockets, as Pushpin's WebSocket-over-HTTP: held by `tric dev`, or on AWS by API Gateway, for the router.
ws = ["dep:hyper-util", "dep:tokio-tungstenite"]

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false } # as object_store has it, for cron's calendar
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true } # as reqwest has it
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
percent-encoding = "2" # as url has it
quick-xml = { version = "0.41", features = ["serialize"] } # as object_store has it, for STS's answers
rand = { version = "0.10", default-features = false, features = ["thread_rng"] } # as object_store has it
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
target-lexicon = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# aws-lc-rs, as object_store's S3 client uses, so one TLS provider is linked, not two.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
# Only the handshake's key and the framing: no TLS, and no client of its own.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2" # as object_store has it, to follow a middleware URL's redirects
wac-graph = "0.12"
# Mozilla's roots, as whole certificates, which is how the S3 client takes them, and outbound too.
webpki-root-certs = "1"
# The defaults minus what tric never uses: cache, profiling, coredump, debug, stack-switching, gc-copying and
# compile-time-builtins (so no wit-parser either).
wasmtime = { version = "=49.0.2", default-features = false, features = [
    "addr2line", "anyhow", "async", "backtrace", "component-model", "component-model-async", "component-model-bytes",
    "cranelift", "demangle", "gc", "gc-drc", "gc-null", "parallel-compilation", "pooling-allocator", "runtime", "std",
    "threads", "wat",
] }
# p2 too, as Rust's standard library on wasm32-wasip2 imports it.
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p2", "p3"] }
# The wasi:io bindings, which wasmtime-wasi does not re-export: the linker takes the stock interfaces minus filesystem,
# and the filesystem's own bindings share these resources.
wasmtime-wasi-io = { version = "=49.0.2", default-features = false, features = ["std"] }
# No `default-send-request`: that is the built-in outbound client, which resolves names after any check on them.
wasmtime-wasi-http = { version = "=49.0.2", default-features = false, features = ["component-model-async", "p3"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["io-util", "process"] }

# Test binaries link side by side, and full debug info for Wasmtime sent `ld` past the 7.7 GiB Podman VM.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
strip = true
