[package]
name = "torpor-cli"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "A scale-to-zero host for WASI components"
publish = false

[lib]
name = "torpor"

[[bin]]
name = "torpor"
path = "src/main.rs"
required-features = ["cli"]

# Embedders use `default-features = false`: the runtime is the library, the platform is the binary.
[features]
default = ["cli"]
cli = [
    "dep:clap", "dep:serde", "dep:toml", "dep:tracing-subscriber",
    "hyper/server", "tokio/macros", "tokio/rt-multi-thread",
]

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"], optional = true }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
object_store = { version = "=0.14.2", default-features = false }
percent-encoding = "2"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
webpki-roots = "1"
# The defaults minus what torpor never uses: cache, profiling, coredump, debug, stack-switching, gc-copying and
# compile-time-builtins (so no wit-parser either).
wasmtime = { version = "=49.0.1", default-features = false, features = [
    "addr2line", "anyhow", "async", "backtrace", "component-model", "component-model-async", "cranelift", "demangle",
    "gc", "gc-drc", "gc-null", "parallel-compilation", "pooling-allocator", "runtime", "std", "threads", "wat",
] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-config = "=49.0.1"
# No `default-send-request`: that is the built-in outbound client, which resolves names after any check on them.
wasmtime-wasi-http = { version = "=49.0.1", default-features = false, features = ["component-model-async", "p2", "p3"] }

[dev-dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

# Test binaries link side by side, and full debug info for Wasmtime sent `ld` past the 7.7 GiB Podman VM.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
strip = true
