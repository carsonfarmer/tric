spin_manifest_version = 2
[variables]
greet = { default = "hello" }
[[trigger.http]]
route = "/..."
component = "c"
[component.c]
source = "../../apps/app-rust7-hello/target/wasm32-wasip2/release/app_rust7_hello.wasm"
allowed_outbound_hosts = ["https://example.com"]
key_value_stores = ["default"]
variables = { greeting = "{{ greet }} world" }
