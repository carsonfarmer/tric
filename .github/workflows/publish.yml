# Publishes the CLI to crates.io from a tag like v0.1.0, whose version must be Cargo.toml's. Off until the repository
# variable PUBLISH is `true`, with the secret CARGO_REGISTRY_TOKEN set to a token that may publish `tric`.
name: publish
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  crate:
    if: vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { COMPOSE_PROJECT_NAME: tric-publish }
    steps:
      - uses: actions/checkout@v7
      - run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
      - run: docker compose build dev
      - run: docker compose run --rm -T -e CARGO_REGISTRY_TOKEN dev cargo publish --locked
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
