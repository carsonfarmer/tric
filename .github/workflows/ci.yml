# The gate, as `docker compose run --rm test` runs it locally: the test components, fmt, clippy, the tests (end to end
# in memory and against MinIO), and a check that the crate packages.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { COMPOSE_PROJECT_NAME: tric-ci }
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build test
      - run: docker compose run --rm -T test
