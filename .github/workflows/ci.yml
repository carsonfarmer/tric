# The Docker gate, as run locally: the test components, fmt, clippy for both feature sets, the tests, and a check that
# the crate packages. The suite against a real bucket (TRIC_TEST_STORE) is run by hand.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { COMPOSE_PROJECT_NAME: tric-ci }
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build dev
      - run: docker compose run --rm fixtures
      - run: >-
          docker compose run --rm -T dev sh -c 'cargo fmt --check
          && cargo clippy --locked --all-targets -- -D warnings
          && cargo clippy --locked --no-default-features --lib -- -D warnings
          && cargo test --locked
          && cargo publish --dry-run --locked --no-verify'
